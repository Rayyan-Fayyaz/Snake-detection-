spring.application.name=CatalogueManagement

spring.datasource.url=jdbc:mysql://localhost:3306/snake_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Mrayyan241204
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
    
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  graphql:
    schema:
      locations: classpath:graphql/
    path: /graphql

otel:
  #exporter
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc

  #disable logs only export traces and metrics
  logs:
    exporter: none

  # Resource attributes (tags for the service)
  resource:
    attributes:
      service.name: CatalogueManagement

  # Traces configuration
  traces:
    sampler: always_on